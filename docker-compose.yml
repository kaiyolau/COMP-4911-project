# Self-hosted stack: MySQL + WildFly backend + ASP.NET frontend behind one nginx gateway,
# published to the internet through a Cloudflare Tunnel (set up once with deploy/setup-tunnel.sh).
# Settings come from .env (see .env.example).
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--skip-name-resolve"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: Project_Management
      MYSQL_USER: project_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: Project_Management
      MYSQL_USER: project_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      PORT: "8080"
      JAVA_OPTS: "-Xms256m -Xmx1g -Djava.net.preferIPv4Stack=true"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      ApiBaseUrl: ${PUBLIC_URL}
      ShowDemoLoginHint: ${SHOW_DEMO_LOGIN_HINT:-true}
    depends_on:
      - backend

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - backend
      - frontend

  tunnel:
    image: cloudflare/cloudflared:2025.8.0
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./.cloudflared:/etc/cloudflared:ro
    depends_on:
      - gateway

volumes:
  mysql_data:
